version: '3.8'
services:
  # Ollama 서버 (GGUF 모델)
  ollama-server:
    image: ollama/ollama:latest
    container_name: ollama-server
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # GGUF 모델 파일 마운트 (Ollama가 사용할 수 있도록)
      - /mnt/shared_models/llm/gemma-3-27b-it-GGUF:/models:ro
      # Ollama 데이터 디렉터리 (모델 캐시 등)
      - ollama-data:/root/.ollama
    environment:
      # CUDA 설정
      - CUDA_VISIBLE_DEVICES=0
    ports:
      - "11434:11434"  # Ollama API 포트
    restart: unless-stopped
    # 참고: Ollama 실행 후 모델 등록 필요
    # docker exec -it ollama-server ollama create gemma-3-27b-it -f /models/gemma-3-27b-it-UD-Q4_K_XL.gguf

volumes:
  ollama-data:
    driver: local
